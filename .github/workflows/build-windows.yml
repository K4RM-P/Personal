name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Bump build version
        id: version
        shell: bash
        run: |
          v="1.0.${{ github.run_number }}"
          npm pkg set version=$v
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # electron-builder auto-detects CSC_LINK/CSC_KEY_PASSWORD from the environment and
      # signs automatically when both are present — these secrets don't exist yet (see
      # docs/CODE_SIGNING_AND_RELEASES.md §2), so today this is a silent no-op producing an
      # unsigned build, exactly like before. Once a cert is bought and added as repo
      # secrets, signing turns on with zero further workflow changes.
      - name: Build Windows installer
        run: npm run build && npx electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # electron-builder's own GitHub publisher is unreliable here: GitHub's
      # "get release by tag" API can't see draft releases, so when
      # electron-builder uploads the installer and then the .blockmap as two
      # separate calls, the second one can't find the release it just made
      # and creates a duplicate draft instead - splitting assets across two
      # releases with the same tag. Publishing ourselves in one `gh` call
      # guarantees a single release with every file attached.
      - name: Publish release
        shell: bash
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/*.exe dist/*.blockmap dist/latest.yml \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Automated Windows build" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe
