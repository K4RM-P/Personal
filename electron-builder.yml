appId: com.electron.app
productName: VantisPOS
directories:
  buildResources: build
files:
  - filter:
      - '**/*'
      - '!**/.vscode/*'
      - '!src/*'
      - '!electron.vite.config.{js,ts,mjs,cjs}'
      - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
      - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
      - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
      - '!.claude/**/*'
      - '!.kilo/**/*'
  # electron-builder's dependency walker doesn't discover node_modules/.prisma
  # (Prisma's generated client — required dynamically, not a declared dependency),
  # so it has to be copied in as an explicit extra file set.
  - from: node_modules/.prisma
    to: node_modules/.prisma
asarUnpack:
  - resources/**
  - node_modules/.prisma/**/*
  - node_modules/@prisma/client/**/*
win:
  executableName: VantisPOS
  # electron-builder signs automatically when CSC_LINK (path or base64 of the .pfx) and
  # CSC_KEY_PASSWORD are set in the build environment — no cert path/password belongs in
  # this file. See docs/CODE_SIGNING_AND_RELEASES.md for how to set these at build time.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    publisherName: 'VantisPOS'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: K4RM-P
  repo: Personal
